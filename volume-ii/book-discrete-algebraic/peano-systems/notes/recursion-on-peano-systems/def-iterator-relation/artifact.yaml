            latex: ambient context
        restriction: null
        body:
          kind: raw_latex
          latex: '\[

            \begin{aligned}

            R \text{ is an iterator relation for } (W,c,g)

            \Longleftrightarrow\;&

            R\subseteq P\times W

            \land (1,c)\in R\\

            &\land

            \forall n\in P\;\forall w\in W\;

            \bigl((n,w)\in R\Longrightarrow (S(n),g(w))\in R\bigr).

            \end{aligned}

            \]'
