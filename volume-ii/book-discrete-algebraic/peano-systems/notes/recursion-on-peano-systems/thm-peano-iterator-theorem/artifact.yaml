    source_path: ''
    code: "theorem peano_iterator_theorem\n    (ps : PeanoSystem)\n    (target : Type)\n\
      \    (initial_value : target)\n    (step_rule : target -> target) :\n    Exists\
      \ (fun iterator_function : ps.carrier -> target =>\n      And\n        (satisfies_iterator_clauses\n\
      \          ps target initial_value step_rule iterator_function)\n        (forall\
      \ other_iterator : ps.carrier -> target,\n          satisfies_iterator_clauses\n\
      \            ps target initial_value step_rule other_iterator ->\n         \
      \ forall element : ps.carrier,\n            other_iterator element = iterator_function\
      \ element)) := by\n  refine\n    Exists.intro\n      (iter ps target initial_value\
      \ step_rule)\n      ?_\n  constructor\n  exact iter_satisfies_iterator_clauses\
      \ ps target initial_value step_rule\n  intro other_iterator other_satisfies\
      \ element\n  exact\n    Eq.symm\n      (iterator_function_unique\n        ps\
      \ target initial_value step_rule\n        (iter ps target initial_value step_rule)\n\
      \        other_iterator\n        (iter_satisfies_iterator_clauses ps target\
      \ initial_value step_rule)\n        other_satisfies\n        element)"
