      restriction: null
      body:
        kind: raw_latex
        latex: '\[

          \begin{aligned}

          f \text{ is a solution of the stage-dependent recursion determined by }
          (W,c,\Phi)

          \Longleftrightarrow\;&

          f\colon P\to W\land f(1)=c\\

          &\land \forall n\in P\;(f(S(n))=\Phi(n,f(n))).

          \end{aligned}

          \]'
