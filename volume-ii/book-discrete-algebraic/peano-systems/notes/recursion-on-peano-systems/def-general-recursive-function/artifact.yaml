statement:
  canonical_prose: Solution of a Stage-Dependent Recursion
  canonical_latex: '\begin{definition}[Solution of a Stage-Dependent Recursion]

    \label{def:general-recursive-function}

    Let $(P,S,1)$ be a Peano system, let $W$ be a set, let $c\in W$, and let

    $\Phi\colon P\times W\to W$ be a stage-dependent step rule. A function

    $f\colon P\to W$

    is called a \emph{solution of the stage-dependent recursion determined by

    $(W,c,\Phi)$}

    exactly when

    \[

    f(1)=c

    \qquad\text{and}\qquad

    \forall n\in P\;(f(S(n))=\Phi(n,f(n))).

    \]

    \end{definition}'
  semantic_ast: &id001
    kind: iff
    left: &id002
      kind: raw_latex
      latex: f \text{ is a solution of the stage-dependent recursion determined by
        } (W,c,Phi)
