    source_path: ''
    code: "theorem minimal_iterator_relation_complete\n    (ps : PeanoSystem)\n  \
      \  (data : IteratorData ps) :\n    forall element : ps.carrier,\n      Exists\
      \ (fun value : data.target =>\n        minimal_iterator_relation ps data element\
      \ value) := by\n  apply induction_principle ps\n\n  case base_case =>\n    exact\n\
      \      Exists.intro\n        data.initial_value\n        (minimal_iterator_relation_is_iterator_relation\
      \ ps data).left\n\n  case successor_step =>\n    intro element induction_hypothesis\n\
      \    cases induction_hypothesis with\n    | intro value value_is_forced =>\n\
      \        exact\n          Exists.intro\n            (data.step_rule value)\n\
      \            ((minimal_iterator_relation_is_iterator_relation ps data).right\n\
      \              element value value_is_forced)"
