statement:
  canonical_prose: Minimal Iterator Relation
  canonical_latex: '\begin{definition}[Minimal Iterator Relation]

    \label{def:minimal-iterator-relation}

    Let $(P,S,1)$ be a Peano system, and let $(W,c,g)$ be iterator data for it.

    The \emph{minimal iterator relation} for $(W,c,g)$ is

    \[

    R^*

    =

    \bigcap\{R\subseteq P\times W : R \text{ is an iterator relation for }

    (W,c,g)\}.

    \]

    \end{definition}'
  semantic_ast:
    kind: iff
    left:
      kind: raw_latex
      latex: left side
    right:
      kind: forall
      binder:
        binder_id: f1
        symbol: f_1
        domain:
          kind: raw_latex
          latex: ambient context
      restriction: null
      body:
        kind: raw_latex
        latex: '\[

          (n,w)\in R^*

          \Longleftrightarrow

          \forall R\subseteq P\times W\;

          \bigl(R \text{ is an iterator relation for } (W,c,g)

          \Longrightarrow (n,w)\in R\bigr).

          \]'
