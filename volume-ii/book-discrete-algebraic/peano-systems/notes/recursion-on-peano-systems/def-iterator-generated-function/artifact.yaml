statement:
  canonical_prose: Iterator-Generated Function
  canonical_latex: '\begin{definition}[Iterator-Generated Function]

    \label{def:iterator-generated-function}

    Let $(P,S,1)$ be a Peano system, and let $(W,c,g)$ be iterator data for it.

    The unique function $f:P\to W$ satisfying

    \[

    f(1)=c

    \qquad\text{and}\qquad

    \forall n\in P\;(f(S(n))=g(f(n)))

    \]

    is called the \emph{iterator-generated function determined by $(W,c,g)$}.

    \end{definition}'
  semantic_ast: &id001
    kind: iff
    left: &id002
      kind: raw_latex
      latex: f \text{ is the iterator-generated function determined by } (W,c,g)
    right: &id009
