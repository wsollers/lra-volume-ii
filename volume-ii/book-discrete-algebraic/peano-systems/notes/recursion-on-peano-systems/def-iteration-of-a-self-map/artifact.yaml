  canonical_latex: '\begin{definition}[Iteration of a Self-Map]

    \label{def:iteration-of-a-self-map}

    Let $(P,S,1)$ be a Peano system, let $W$ be a set, let $c\in W$, and let

    $g:W\to W$. The iterator-generated function determined by $(W,c,g)$ is called

    the \emph{iteration of $g$ from $c$ along $P$}.

    \end{definition}'
  semantic_ast: &id001
    kind: iff
    left: &id002
      kind: raw_latex
      latex: f \text{ is the iteration of } g \text{ from } c \text{ along } P
    right: &id003
      kind: raw_latex
      latex: f \text{ is the iterator-generated function determined by } (W,c,g)
