statement:
  canonical_prose: Induction Axiom
  canonical_latex: '\begin{axiom}[Induction Axiom]

    \label{ax:peano-induction}

    Let $A \subseteq P$. If $1 \in A$ and if

    \[

    \forall n \in P\;(n \in A \Longrightarrow S(n) \in A),

    \]

    then $A=P$.

    \end{axiom}'
