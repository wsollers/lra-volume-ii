statement:
  canonical_prose: Peano System
  canonical_latex: "\\begin{definition}[Peano System]\n\\label{def:peano-system}\n\
    A triple $(P,S,1)$, where $P$ is a set, is called a \\emph{Peano system}\nexactly\
    \ when the following clauses hold:\n\\begin{enumerate}\n  \\item[\\textbf{P1.}]\
    \ $1 \\in P$.\n  \\item[\\textbf{P2.}] $S\\colon P\\to P$ is a function.\n  \\\
    item[\\textbf{P3.}] For every $n \\in P$, $S(n) \\neq 1$.\n  \\item[\\textbf{P4.}]\
    \ For all $m,n \\in P$, if $S(m)=S(n)$ then $m=n$.\n  \\item[\\textbf{P5.}] If\
    \ $A \\subseteq P$, $1 \\in A$, and\n  \\[\n    \\forall n \\in P\\;(n \\in A\
    \ \\Longrightarrow S(n) \\in A),\n  \\]\n  then $A=P$.\n\\end{enumerate}\n\\end{definition}"
