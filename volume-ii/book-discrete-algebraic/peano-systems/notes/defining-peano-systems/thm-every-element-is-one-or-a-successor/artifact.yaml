    source_reference: Landau, \emph{Foundations of Analysis
    source_path: ''
    code: "theorem every_element_is_one_or_successor\n    (ps : PeanoSystem) :\n \
      \   forall element : ps.carrier,\n      Or (element = ps.one)\n        (Exists\
      \ (fun predecessor : ps.carrier =>\n          ps.successor predecessor = element))\
      \ := by\n  let D : ps.carrier -> Prop :=\n    fun candidate_element =>\n   \
      \   Or (candidate_element = ps.one)\n        (Exists (fun predecessor : ps.carrier\
      \ =>\n          ps.successor predecessor = candidate_element))\n\n  apply induction_principle\
      \ ps D\n\n  case base_case =>\n    exact Or.inl rfl\n\n  case successor_step\
      \ =>\n    intro element induction_hypothesis\n    exact Or.inr (Exists.intro\
      \ element rfl)"
