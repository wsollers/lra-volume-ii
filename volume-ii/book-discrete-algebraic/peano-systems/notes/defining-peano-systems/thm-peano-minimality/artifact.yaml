statement:
  canonical_prose: Minimality of a Peano System
  canonical_latex: '\begin{theorem}[Minimality of a Peano System]

    \label{thm:peano-minimality}

    Let $(P,S,1)$ be a Peano system. If $A\subseteq P$ contains $1$ and is closed

    under successor, then $A=P$. In quantified form,

    \[

    \forall A\subseteq P,\qquad

    \left[

    \left(1\in A \land

    \forall n\in A,\ S(n)\in A\right)

    \Longrightarrow A=P

    \right]

    \]

    \hyperref[prf:peano-minimality]{Go to proof.}

    \end{theorem}'
